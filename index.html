<!DOCTYPE html>
<html>
<head>
    <title>Return Fraud Detector</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px;
        }

        input {
            margin: 10px;
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 10px 20px;
            background: #22c55e;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #16a34a;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Return Fraud Detector 🚀</h1>

    <input type="number" id="total_orders" placeholder="Total Orders"><br>
    <input type="number" id="total_spent" placeholder="Total Spent"><br>
    <input type="number" id="total_returns" placeholder="Total Returns"><br>
    <input type="number" step="0.01" id="return_ratio" placeholder="Return Ratio"><br>
    <input type="number" id="customer_lifetime_days" placeholder="Lifetime Days"><br>
    <input type="number" id="avg_order_value" placeholder="Avg Order Value"><br>
    <input type="number" step="0.01" id="purchase_frequency" placeholder="Purchase Frequency"><br>

    <br>
    <button onclick="predict()">Check Fraud</button>

    <div class="result" id="result"></div>

    <script>
        async function predict() {
            const data = {
                total_orders: Number(document.getElementById("total_orders").value),
                total_spent: Number(document.getElementById("total_spent").value),
                total_returns: Number(document.getElementById("total_returns").value),
                return_ratio: Number(document.getElementById("return_ratio").value),
                customer_lifetime_days: Number(document.getElementById("customer_lifetime_days").value),
                avg_order_value: Number(document.getElementById("avg_order_value").value),
                purchase_frequency: Number(document.getElementById("purchase_frequency").value)
            };

            const response = await fetch("http://127.0.0.1:5000/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            document.getElementById("result").innerHTML =
                "Fraud Prediction: " + result.fraud_prediction +
                "<br>Risk Score: " + result.risk_score;
        }
    </script>

</body>
</html>
