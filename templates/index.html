<!DOCTYPE html>
<html>
<head>
    <title>Return Fraud Detector</title>

    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>

<body>

    <div class="container">

        <h1>Return Fraud Detector 🚀</h1>
        <p class="subtitle">AI-powered fraud risk analysis system</p>

        <div class="grid">

            <div class="input-group">
                <label>Total Orders</label>
                <input type="number" id="total_orders">
            </div>

            <div class="input-group">
                <label>Total Spent</label>
                <input type="number" id="total_spent">
            </div>

            <div class="input-group">
                <label>Total Returns</label>
                <input type="number" id="total_returns">
            </div>

            <div class="input-group">
                <label>Return Ratio</label>
                <input type="number" step="0.01" id="return_ratio">
            </div>

            <div class="input-group">
                <label>Customer Lifetime</label>
                <input type="number" id="customer_lifetime_days">
            </div>

            <div class="input-group">
                <label>Avg Order Value</label>
                <input type="number" id="avg_order_value">
            </div>

            <div class="input-group">
                <label>Purchase Frequency</label>
                <input type="number" step="0.01" id="purchase_frequency">
            </div>

        </div>

        <button onclick="predict()">Analyze Risk</button>

        <div id="result" class="result-box"></div>

    </div>

</body>
</html>
