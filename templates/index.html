<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Return Fraud Detector</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <h1>Return Fraud Detector</h1>
      <p>AI-powered fraud risk analysis</p>
    </div>
  </header>

  <main class="main">
    <section class="card form-card">
      <h2>Customer Input</h2>

      <div class="form-grid">
        <div class="field">
          <label>Total Orders</label>
          <input type="number" id="total_orders" placeholder="e.g. 25">
        </div>

        <div class="field">
          <label>Total Spent</label>
          <input type="number" id="total_spent" placeholder="e.g. 5000">
        </div>

        <div class="field">
          <label>Total Returns</label>
          <input type="number" id="total_returns" placeholder="e.g. 5">
        </div>

        <div class="field">
          <label>Return Ratio</label>
          <input type="number" step="0.01" id="return_ratio" placeholder="e.g. 0.2">
        </div>

        <div class="field">
          <label>Customer Lifetime (days)</label>
          <input type="number" id="customer_lifetime_days" placeholder="e.g. 120">
        </div>

        <div class="field">
          <label>Avg Order Value</label>
          <input type="number" id="avg_order_value" placeholder="e.g. 200">
        </div>

        <div class="field full">
          <label>Purchase Frequency</label>
          <input type="number" step="0.01" id="purchase_frequency" placeholder="e.g. 0.3">
        </div>
      </div>

      <button class="btn" onclick="predict()">Analyze Risk</button>
    </section>

    <section class="card result-card" id="result">
      <h2>Prediction Result</h2>
      <div class="result-body">
        <p class="muted">Enter values and click Analyze</p>
      </div>
    </section>
  </main>

</body>
</html>
